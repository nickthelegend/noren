# CRE project settings for Noren's CCTP relay (USDC from other chains into Arc via Circle CCTP V2).
# Log triggers read each source testnet; the only write target is NorenArcHook on Arc Testnet through the
# arc-testnet MockKeystoneForwarder 0x6E9EE680ef59ef64Aa8C7371279c27E496b5eDc1 (cre workflow simulate --broadcast).
# --broadcast needs CRE_ETH_PRIVATE_KEY funded with USDC (Arc's gas token) on Arc Testnet.
staging-settings:
  rpcs:
    - chain-name: arc-testnet
      url: https://rpc.testnet.arc.io
    - chain-name: ethereum-testnet-sepolia-base-1
      url: https://sepolia.base.org
    - chain-name: ethereum-testnet-sepolia-arbitrum-1
      url: https://sepolia-rollup.arbitrum.io/rpc
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com
    - chain-name: robinhood-testnet
      url: https://rpc.testnet.chain.robinhood.com
    - chain-name: ethereum-testnet-sepolia-optimism-1
      url: https://sepolia.optimism.io
    - chain-name: avalanche-testnet-fuji
      url: https://api.avax-test.network/ext/bc/C/rpc
    - chain-name: polygon-testnet-amoy
      url: https://polygon-amoy-bor-rpc.publicnode.com
    - chain-name: ethereum-testnet-sepolia-unichain-1
      url: https://sepolia.unichain.org
    - chain-name: ethereum-testnet-sepolia-linea-1
      url: https://rpc.sepolia.linea.build
    - chain-name: ethereum-testnet-sepolia-worldchain-1
      url: https://worldchain-sepolia.g.alchemy.com/public
    - chain-name: ink-testnet-sepolia
      url: https://rpc-gel-sepolia.inkonchain.com
