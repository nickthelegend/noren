# CRE project settings for the Noren rate oracle.
# The workflow writes to Arc Testnet (CRE chain "arc-testnet", chain ID 5042002).
# Arc mainnet (5042) is read over HTTP JSON-RPC inside the workflow, so it needs no entry here.

# Local Anvil fork of Arc Testnet on 127.0.0.1:8710 (scripts/fork-simulate.sh starts it).
# The fork carries Arc Testnet's MockKeystoneForwarder 0x6E9EE680ef59ef64Aa8C7371279c27E496b5eDc1.
local-fork:
  rpcs:
    - chain-name: arc-testnet
      url: http://127.0.0.1:8710

# Public Arc Testnet. --broadcast here needs a funded Arc Testnet key in CRE_ETH_PRIVATE_KEY.
staging-settings:
  rpcs:
    - chain-name: arc-testnet
      url: https://rpc.testnet.arc.io
