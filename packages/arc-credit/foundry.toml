[profile.default]
src = 'src'
out = 'out'
test = 'test'
script = 'script'
libs = ['node_modules']
solc_version = '0.8.28'
evm_version = 'cancun'
optimizer = true
optimizer_runs = 10000
bytecode_hash = 'none'
cbor_metadata = false

[profile.default.lint]
exclude_lints = ['block-timestamp', 'unsafe-typecast']

# Arc testnet fork against the live Kohaku Entrypoint and USDC pool (drawToPool).
[profile.fork]
test = 'fork-test'

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
