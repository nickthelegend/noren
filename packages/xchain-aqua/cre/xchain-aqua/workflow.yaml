# CRE workflow settings for Noren cross-chain Aqua.
local-fork:
  user-workflow:
    workflow-name: "noren-xchain-aqua-fork"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.local-fork.json"
    secrets-path: ""

staging-settings:
  user-workflow:
    workflow-name: "noren-xchain-aqua"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: ""

# The LIVE Arc Testnet stack (docs/AQUA-LIVE.md): AquaOrderOpened on the live NorenArcActionRouter ->
# ROUTER_ORDER report -> live NorenCrossChainSettler (scripts/live/aqua-live.ts writes the config).
arc-live-settings:
  user-workflow:
    workflow-name: "noren-xchain-aqua-arc-live"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.arc-live.json"
    secrets-path: ""
